<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Analytics (GA4) 방문 통계
       광고 차단기가 아래 첫 번째 줄을 막아도, gtag 함수는 두 번째 블록에서 직접 만들어 두기 때문에
       사이트는 그대로 작동해요 (기록만 안 될 뿐). -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8WF0LNH1V7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    // 주소 끝에 ?debug=1 을 붙여 열면 GA의 DebugView 에서 이벤트를 바로 확인할 수 있어요.
    // language / site_language: 한국어판 'ko' (페이지 방문 기록에도 같이 남아요)
    var gaConfig = { language: 'ko', site_language: 'ko' };
    if (/[?&]debug=1\b/.test(location.search)) gaConfig.debug_mode = true;
    gtag('config', 'G-8WF0LNH1V7', gaConfig);
  </script>
  <title>전생에 나는 뭐였을까 — 역사 속 내 팔자 테스트</title>
  <meta name="description" content="역사 속 내 팔자 테스트">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">

  <!-- 링크 미리보기 (카톡·인스타·페이스북 등에 주소 붙였을 때 뜨는 제목·그림) -->
  <!-- 사이트 주소(GitHub Pages)가 바뀌면 아래 주소 3곳도 같이 바꿔 주세요.
       미리보기 그림을 다시 만들려면 tools/미리보기그림.html 참고 -->
  <meta property="og:url" content="https://koreanracooncoon-spec.github.io/racooncoon/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="전생에 나는 뭐였을까">
  <meta property="og:description" content="역사 속 내 팔자 테스트">
  <meta property="og:image" content="https://koreanracooncoon-spec.github.io/racooncoon/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="전생에 나는 뭐였을까">
  <meta name="twitter:description" content="역사 속 내 팔자 테스트">
  <meta name="twitter:image" content="https://koreanracooncoon-spec.github.io/racooncoon/og-image.png">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:locale:alternate" content="en_US">

  <!-- 언어판 주소 안내 (검색엔진용): 한국어판은 지금 주소, 영어판은 /en/ -->
  <link rel="canonical" href="https://koreanracooncoon-spec.github.io/racooncoon/">
  <link rel="alternate" hreflang="ko" href="https://koreanracooncoon-spec.github.io/racooncoon/">
  <link rel="alternate" hreflang="en" href="https://koreanracooncoon-spec.github.io/racooncoon/en/">

  <!-- 폰트: 제목은 만화 느낌, 본문은 읽기 편한 고딕 (인터넷이 없으면 기본 글꼴로 보여요) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
  <!-- ?v=날짜 : 파일을 고치면 이 날짜도 바꿔 주세요. 방문자 브라우저가 예전 파일을 쓰지 않고 새로 받아요. -->
  <link rel="stylesheet" href="style.css?v=20261020">
</head>
<body>
<div id="app">

  <!-- 언어 바꾸기 (누르면 영어판 주소 /en/ 으로 이동) -->
  <nav class="lang-switch" aria-label="Language">
    <span class="lang-btn active" aria-current="page" lang="ko">한국어</span>
    <a class="lang-btn" href="en/" hreflang="en" lang="en">English</a>
  </nav>

  <!-- 브라우저 언어가 한국어가 아닌 사람에게만 뜨는 안내 (자동으로 옮기지는 않음) -->
  <div class="en-hint hidden" id="en-hint" lang="en">
    <a href="en/" hreflang="en">English version →</a>
    <button type="button" class="en-hint-close" id="en-hint-close" aria-label="Close">×</button>
  </div>

  <!-- ========== 1. 시작 화면 ========== -->
  <section class="screen" id="screen-start">
    <div class="collage" id="collage"></div>
    <h1 class="title" id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
    <p class="intro" id="intro"></p>
    <div class="start-wrap">
      <button class="btn btn-main" id="start-btn"></button>
    </div>
  </section>

  <!-- ========== 2. 질문 화면 ========== -->
  <section class="screen hidden" id="screen-quiz">
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-count" id="progress-count"></span>
    </div>
    <p class="progress-comment" id="progress-comment"></p>
    <p class="luck-notice hidden" id="luck-notice"></p>
    <div class="card quiz-card" id="quiz-card">
      <span class="question-num" id="question-num"></span>
      <p class="question-text" id="question-text"></p>
    </div>
    <div class="options" id="options"></div>
  </section>

  <!-- ========== 3. 로딩 화면 ========== -->
  <section class="screen hidden" id="screen-loading">
    <div class="loading-icon">🔮</div>
    <p class="loading-text" id="loading-text"></p>
    <div class="progress-track big"><div class="progress-fill" id="loading-fill"></div></div>
    <p class="loading-pct" id="loading-pct">0%</p>
  </section>

  <!-- ========== 4. 결과 화면 ========== -->
  <section class="screen hidden" id="screen-result">
    <p class="result-label" id="result-label"></p>
    <div class="hero">
      <div class="hero-portrait" id="result-portrait"></div>
      <div class="bubble">
        <p id="bubble-text"></p>
        <p class="bubble-skip" id="bubble-skip"></p>
      </div>
    </div>
    <div class="name-tag">
      <span class="era-chip" id="result-era"></span>
      <h2 id="result-name"></h2>
      <p class="signature" id="result-signature"></p>
    </div>

    <div class="info-grid">
      <div class="card info"><p class="info-title" id="info-job-title">💼 직업</p><p id="info-job"></p></div>
      <div class="card info"><p class="info-title" id="info-money-title">💰 재산</p><p id="info-money"></p><p class="info-sub" id="info-money-now"></p></div>
      <div class="card info"><p class="info-title" id="info-day-title">🕰️ 하루 일과</p><p id="info-day"></p></div>
      <div class="card info"><p class="info-title" id="info-danger-title">☠️ 사망 플래그 위험도</p><p class="stars" id="info-danger"></p><p class="info-sub" id="info-danger-note"></p></div>
    </div>

    <div class="card history">
      <p class="history-title" id="history-title"></p>
      <p id="history-text"></p>
    </div>

    <div class="relations">
      <div class="card relation match" id="match-box"></div>
      <div class="card relation enemy" id="enemy-box"></div>
    </div>

    <div class="card chart-card">
      <p class="chart-title" id="chart-title"></p>
      <div id="chart"></div>
    </div>

    <div class="result-buttons">
      <button class="btn btn-main" id="share-btn"></button>
      <button class="btn btn-sub" id="retry-btn"></button>
    </div>
  </section>

  <!-- 구석 훈수 캐릭터 -->
  <div class="kibitz" id="kibitz" aria-live="polite">
    <div class="kibitz-bubble" id="kibitz-text"></div>
    <div class="kibitz-face">😏</div>
  </div>

  <div class="toast" id="toast"></div>

  <footer class="site-footer" id="footer">방문 통계를 위해 익명 데이터를 수집합니다</footer>
</div>

<!-- 순서 중요: data.js 가 먼저! (영어판은 en/index.html) -->
<script src="data.js?v=20261020"></script>
<script src="script.js?v=20261020"></script>
</body>
</html>
